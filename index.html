<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone 15 粉色 換機募資</title>
  <style>
    :root {
      --pink-primary: #e898aa;
      --pink-dark: #d47b8f;
      --pink-bg: #fff5f7;
      --pink-border: #f3b4c1;
      --text-black: #111111;
      --text-muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: #ffffff;
      color: var(--text-black);
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #eeeeee;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .img-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--pink-border);
      background: #fafafa;
      margin-bottom: 18px;
      text-align: center;
    }
    .img-box img {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      display: block;
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--pink-primary);
      background: var(--pink-bg);
      border: 1px solid var(--pink-border);
      border-radius: 20px;
      padding: 3px 12px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-black);
      line-height: 1.4;
    }
    .intro {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .progress-section {
      background: #fdfdfd;
      border: 1px solid #eeeeee;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 22px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .current-amt {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-black);
    }
    .stats-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }
    .target-amt {
      font-size: 14px;
      color: var(--text-muted);
    }
    .bar-bg {
      width: 100%;
      height: 14px;
      background: #f0f0f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      width: 0%;
      height: 100%;
      background: var(--pink-primary);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .thankyou-alert {
      display: none;
      background: #fff0f3;
      border: 1.5px solid var(--pink-primary);
      color: var(--text-black);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .closed-alert {
      display: none;
      background: var(--pink-bg);
      border: 1.5px solid var(--pink-primary);
      color: var(--text-black);
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      text-align: center;
      line-height: 1.7;
      margin-bottom: 18px;
      font-size: 14.5px;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-black);
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--pink-primary);
      box-shadow: 0 0 0 3px rgba(232, 152, 170, 0.2);
    }
    .form-group input:disabled { background: #f6f6f6; }

    .form-error {
      display: none;
      color: #e11d48;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--pink-primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }
    .btn-submit:hover { background: var(--pink-dark); }
    .btn-submit:disabled {
      background: #d4d4d4;
      cursor: not-allowed;
    }

    .donor-section {
      margin-top: 26px;
      border-top: 1px solid #eeeeee;
      padding-top: 18px;
    }
    .donor-section h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .sync-status {
      font-size: 12px;
      color: #999999;
      margin: -6px 0 12px;
    }
    .sync-status.error { color: #e11d48; }
    .donor-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    .donor-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      background: var(--pink-bg);
      border: 1px solid var(--pink-border);
      border-radius: 8px;
      font-size: 14px;
    }
    .donor-row .name { font-weight: 600; word-break: break-all; }
    .donor-row .amt { font-weight: 700; color: var(--pink-dark); white-space: nowrap; }
    .donor-empty { font-size: 13px; color: #999999; padding: 6px 0; }
  </style>
</head>
<body>

<div class="card">
  <div class="img-box">
    <img src="p1.jpg" alt="iPhone 15 128G 粉色商品圖">
  </div>

  <span class="badge">目標：iPhone 15 128G 粉色</span>
  <h1>🌸 Jony 生日快到了，還不知道送什麼嗎？</h1>
  <p class="intro">
    自己伸手要禮物還是有點哈茲咖系，我想要買一隻工作用的手機，因為我之後會辦兩個工作帳號。<br>
    所以要是不知道送我什麼，也可以當贊助我買工作用的手機作為生日禮物！灰常感謝！
  </p>

  <div class="progress-section">
    <div class="stats-row">
      <div>
        <span class="current-amt" id="currentTotal">載入中...</span>
        <span class="stats-label">已募集</span>
      </div>
      <div class="target-amt">目標：$12,500 (<span id="percentageText">0%</span>)</div>
    </div>
    <div class="bar-bg">
      <div class="bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="closed-alert" id="closedAlert">
    🎉 感謝各位黃仁勳、郭台銘、賈永婕!!<br>
    目前已達成目標金額 $12,500。<br>
    順利獲得一台生日贊助手機啦！
  </div>

  <div class="thankyou-alert" id="thankyouAlert">
    💖 感謝再感謝！Jony的成功的一天都是因為你們的一路相隨 🥰🎈✨🫶🎉🥳🍰🍬💖
  </div>

  <form id="sponsorForm">
    <div class="form-group">
      <label for="sponsorName">贊助者姓名 / 暱稱</label>
      <input type="text" id="sponsorName" maxlength="30" placeholder="請輸入你的大名" required>
    </div>

    <div class="form-group">
      <label for="sponsorAmount">贊助金額</label>
      <input type="number" id="sponsorAmount" min="100" step="100" placeholder="例如：3000" required>
    </div>

    <p class="form-error" id="formError" role="alert"></p>
    <button type="submit" class="btn-submit" id="submitBtn">確認送出贊助</button>
  </form>

  <div class="donor-section">
    <h3>每當我使用這部手機，我就會想起你們</h3>
    <p class="sync-status" id="syncStatus">連線中…</p>
    <ul class="donor-list" id="donorList">
      <li class="donor-empty">資料連線讀取中...</li>
    </ul>
  </div>
</div>

<script>
  // Google Apps Script 網頁應用程式網址（需部署為「所有人」可存取）
  const API_URL = "https://script.google.com/macros/s/AKfycbzjku6NCFdVTuXtfj-Eo4zDGkWoQW1XBrJdeiFqXRA0OuN-IZTXpq2UiOtNV72m-XcpZQ/exec";

  const TARGET_GOAL = 12500;
  const MIN_AMOUNT = 100;
  const POLL_INTERVAL_MS = 5000; // 每 5 秒自動同步一次

  let records = [];
  let lastSnapshot = "";
  let loaded = false;
  let submitting = false;
  let thankyouTimer = null;

  const currentTotal = document.getElementById("currentTotal");
  const percentageText = document.getElementById("percentageText");
  const progressBar = document.getElementById("progressBar");
  const closedAlert = document.getElementById("closedAlert");
  const thankyouAlert = document.getElementById("thankyouAlert");
  const sponsorForm = document.getElementById("sponsorForm");
  const submitBtn = document.getElementById("submitBtn");
  const sponsorName = document.getElementById("sponsorName");
  const sponsorAmount = document.getElementById("sponsorAmount");
  const donorList = document.getElementById("donorList");
  const formError = document.getElementById("formError");
  const syncStatus = document.getElementById("syncStatus");

  // 避免名稱內含 HTML 標籤破壞版面或被注入
  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function getTotal() {
    return records.reduce((sum, item) => sum + item.amount, 0);
  }

  function showError(msg) {
    formError.textContent = msg;
    formError.style.display = msg ? "block" : "none";
  }

  function setSync(ok, text) {
    syncStatus.textContent = text;
    syncStatus.classList.toggle("error", !ok);
  }

  // 同時相容兩種後端回傳格式：[{name, amount}, ...] 或 {ok, records: [...]}
  function extractRecords(data) {
    if (data && data.ok === false) throw new Error(data.error || "伺服器回報錯誤");
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.records) ? data.records : null);
    if (!list) throw new Error("資料格式不正確");
    return list
      .map(r => ({ name: String((r && r.name) || "").trim(), amount: Number(r && r.amount) }))
      .filter(r => r.name && Number.isFinite(r.amount));
  }

  function renderData() {
    const total = getTotal();
    const percent = Math.min((total / TARGET_GOAL) * 100, 100);
    const reached = total >= TARGET_GOAL;

    currentTotal.textContent = `$${total.toLocaleString()}`;
    percentageText.textContent = `${percent.toFixed(1)}%`;
    progressBar.style.width = `${percent}%`;

    closedAlert.style.display = reached ? "block" : "none";
    submitBtn.disabled = reached || submitting || !loaded;
    sponsorName.disabled = reached;
    sponsorAmount.disabled = reached;
    submitBtn.textContent = reached
      ? "已達成目標，關閉填寫"
      : submitting ? "資料送出中..." : "確認送出贊助";

    if (records.length > 0) {
      donorList.innerHTML = records
        .slice()
        .reverse()
        .map(item => `
          <li class="donor-row">
            <span class="name">${escapeHTML(item.name)}</span>
            <span class="amt">+$${item.amount.toLocaleString()}</span>
          </li>
        `).join("");
    } else {
      donorList.innerHTML = '<li class="donor-empty">目前尚無贊助紀錄</li>';
    }
  }

  // 內容有變才重繪，避免名單的捲動位置被重設
  function applyRecords(list) {
    const snapshot = JSON.stringify(list);
    const firstLoad = !loaded;
    loaded = true;
    if (firstLoad || snapshot !== lastSnapshot) {
      lastSnapshot = snapshot;
      records = list;
      renderData();
    }
  }

  async function syncNow() {
    if (submitting) return;
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      applyRecords(extractRecords(await res.json()));
      const t = new Date().toLocaleTimeString("zh-TW", { hour12: false });
      setSync(true, `🟢 即時同步中（最後更新 ${t}）`);
    } catch (err) {
      console.error("同步失敗：", err);
      setSync(false, "⚠️ 連線不穩，稍後會自動重試");
      if (!loaded) {
        currentTotal.textContent = "—";
        donorList.innerHTML = '<li class="donor-empty">暫時無法載入紀錄，請稍後再試</li>';
      }
    }
  }

  function showThankYou() {
    thankyouAlert.style.display = "block";
    clearTimeout(thankyouTimer);
    thankyouTimer = setTimeout(() => {
      thankyouAlert.style.display = "none";
    }, 6000);
  }

  sponsorForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    showError("");

    if (submitting || !loaded || getTotal() >= TARGET_GOAL) return;

    const name = sponsorName.value.trim();
    const amt = parseInt(sponsorAmount.value, 10);

    if (!name) {
      showError("請填寫您的大名喔～");
      return;
    }
    if (!Number.isFinite(amt) || amt < MIN_AMOUNT) {
      showError(`贊助金額最低 $${MIN_AMOUNT} 喔！`);
      return;
    }

    submitting = true;
    renderData();

    try {
      // 用 text/plain 送出，避免瀏覽器跨網域預檢（Apps Script 不支援 OPTIONS）
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ name: name, amount: amt })
      });
      if (!res.ok) throw new Error("送出失敗，請再試一次！");

      // 若後端有回報錯誤（例如剛好有人先達標），顯示原因
      let data = null;
      try { data = await res.json(); } catch (_) { /* 後端沒回 JSON 也算成功 */ }
      if (data && data.ok === false) throw new Error(data.error || "送出失敗，請再試一次！");

      sponsorName.value = "";
      sponsorAmount.value = "";
      showThankYou();
    } catch (err) {
      showError(err.message || "送出失敗，請再試一次！");
    } finally {
      submitting = false;
      renderData();
      syncNow(); // 無論成功與否，都重新同步最新的全體資料
    }
  });

  // 輪詢同步：分頁在背景時暫停，回到前景立即更新
  setInterval(() => { if (!document.hidden) syncNow(); }, POLL_INTERVAL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });

  syncNow();
</script>

</body>
</html>
